declarations:
  ethics_approval: "Not applicable. This study was a secondary computational analysis of five publicly available, de-identified benchmark datasets; no participants were recruited and no new human data were collected."
  consent_for_publication: "Not applicable. The manuscript contains no identifiable participant information."
  competing_interests: "All authors declare that they have no competing interests or relevant financial or non-financial relationships to disclose."
  funding: "This work was supported by the Joint Fund for Medical Artificial Intelligence (MAI2023C005) and the Guangdong Key Disciplines Project (2024ZDJS137). The funders provided financial support and had no role in the study design or the decision to submit the manuscript for publication."
  funder_role_statement_confirmed: true
  contributions: "Xianjun Ye designed the experimental methodology and collected and curated the datasets. Ruxue Xing assisted with model training, revised the manuscript, and organized the references. Mengmeng Zhang and Ye Zhang reviewed the provided annotations and organized the data; they did not create or adjudicate new reference masks. Yongsheng Luo contributed to model refinement and manuscript review and editing. Yu Kang supervised the overall research direction and critically revised the manuscript. Jianjun Zhu conducted the experiments, led model training, and drafted the manuscript. All authors read and approved the final manuscript."
  acknowledgements: "Not applicable."
  ai_use: "OpenAI Codex was used for code-assisted reproducibility checks and English language editing during manuscript preparation. The authors reviewed and take responsibility for the experimental code, numerical results, citations, and final text. No generative model was treated as an author."
