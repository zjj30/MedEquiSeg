statistics:
  bootstrap_repetitions: 10000
  bootstrap_seed: 12345
  case_seed_reduction: mean
  multiplicity_correction: holm
  resampling_unit_by_dataset:
    medclipseg_busi: case_id
    medclipseg_clinicdb: group_id
    medclipseg_busbra: group_id
    medclipseg_brisc: case_id
    medclipseg_covid19: patient_id
datasets:
  medclipseg_busi:
    manifest: smoke_tests/protocol_v3/manifests/medclipseg_busi_full.csv
