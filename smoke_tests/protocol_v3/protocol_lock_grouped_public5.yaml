    grouping_unit: image
  medclipseg_clinicdb:
    manifest: smoke_tests/protocol_v3/manifests/medclipseg_clinicdb_grouped.csv
    prompt_source: official_medclipseg
    grouping_unit: video_sequence
    group_field: group_id
  medclipseg_busbra:
    manifest: smoke_tests/protocol_v3/manifests/medclipseg_busbra_grouped.csv
    prompt_source: official_medclipseg
    grouping_unit: patient
    group_field: group_id
  medclipseg_brisc:
    manifest: smoke_tests/protocol_v3/manifests/medclipseg_brisc_full.csv
